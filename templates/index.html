<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>8 Reines</title>
    <style>
        table { border-collapse: collapse; }
        td {
            width: 50px; height: 50px;
            text-align: center;
            vertical-align: middle;
            font-size: 30px;
        }
        .white { background-color: #f0d9b5; }
        .black { background-color: #b58863; }
    </style>
</head>
<body>
    <h1>Solution du probleme des 8 reines</h1>
    <table>
        {% for i in range(8) %}
        <tr>
            {% for j in range(8) %}
            <td class="{{ 'white' if (i+j)%2==0 else 'black' }}">
                {% if board[i][j] == 1 %} ♛ {% endif %}
            </td>
            {% endfor %}
        </tr>
        {% endfor %}
    </table>
</body>
</html>
